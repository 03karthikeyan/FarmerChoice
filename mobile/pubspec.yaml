publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.5
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
